name: Release desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release; leave empty for the next patch
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: prepare-desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - name: Prepare versions and changelog
        id: version
        env:
          NOD_RELEASE_VERSION: ${{ inputs.version }}
          NOD_RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: node .github/scripts/prepare-desktop-release.mjs
      - name: Prepare the release PR description
        run: |
          cat > "$RUNNER_TEMP/release-pr.md" <<'TEXT'
          Merge this PR after review and CI. CI on the merge commit builds Mac Intel, Mac ARM, Windows x64 and Linux x64 packages. It checks all four bundles and publishes one regular Nod GitHub release. Linux is a Flatpak preview. Its bundle includes the runtime and arrives in numbered parts with checksums.

          If main changes before merge, run Release desktop again to update this PR.

          TEXT
          cat "$RUNNER_TEMP/release-notes.md" >> "$RUNNER_TEMP/release-pr.md"
      - name: Open or update the release PR
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1
        with:
          branch: release/desktop
          base: main
          title: 'chore(release): Nod desktop ${{ steps.version.outputs.version }}'
          commit-message: 'chore(release): Nod desktop ${{ steps.version.outputs.version }}'
          body-path: ${{ runner.temp }}/release-pr.md
          add-paths: |
            desktop/package.json
            desktop/release.json
            desktop/CHANGELOG.md
      - name: Run CI for the bot-created release branch
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          gh workflow run ci.yml --ref release/desktop
          gh workflow run pr-title.yml --ref release/desktop -f pull_request="$PR_NUMBER"
